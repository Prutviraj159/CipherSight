services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lookalike
      POSTGRES_USER: lookalike
      POSTGRES_PASSWORD: lookalike
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookalike -d lookalike"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://lookalike:lookalike@db:5432/lookalike
      JWT_SECRET: replace-before-production
      ADMIN_PASSWORD: change-me
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["api", "default"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    profiles: ["frontend", "default"]

  worker:
    build: .
    command: sh -c "echo 'Mock worker started' && sleep infinity"
    environment:
      DATABASE_URL: postgresql+psycopg://lookalike:lookalike@db:5432/lookalike
    depends_on:
      db:
        condition: service_healthy
    profiles: ["worker"]

  test:
    build: .
    command: sh -c "PYTHONPATH=/service pytest -v"
    environment:
      DATABASE_URL: postgresql+psycopg://lookalike:lookalike@db:5432/lookalike
      JWT_SECRET: replace-before-production
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres_data:
